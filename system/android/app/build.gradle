// BanglaLPR Android: one code base, two builds. "v1" carries the V1 models, "v2" the V2 models (src/<flavor>/assets).
// Everything runs on the phone with ONNX Runtime; the app has no INTERNET permission.
plugins { id 'com.android.application' }

android {
    namespace 'bd.nsu.banglalpr'
    compileSdk 34

    defaultConfig {
        applicationId 'bd.nsu.banglalpr'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }   // x86_64: emulators (BlueStacks, Android Studio)
    }
    flavorDimensions = ['model']
    productFlavors {
        v1 {
            dimension 'model'
            applicationIdSuffix '.v1'
            resValue 'string', 'app_name', 'BanglaLPR V1'
            buildConfigField 'String', 'MODEL', '"v1"'
        }
        v2 {
            dimension 'model'
            applicationIdSuffix '.v2'
            resValue 'string', 'app_name', 'BanglaLPR V2'
            buildConfigField 'String', 'MODEL', '"v2"'
        }
        v3 {                                   // V2 engine + models, plus records (plate pictures + CSV) and new screens
            dimension 'model'
            applicationIdSuffix '.v3'
            versionName '3.0'
            resValue 'string', 'app_name', 'BanglaLPR V3'
            buildConfigField 'String', 'MODEL', '"v3"'
        }
    }
    sourceSets {
        v3 { assets.srcDirs = ['src/v2/assets'] }   // the same ONNX files as V2 (no copy)
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'onnx' }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug      // installable side-loaded APK (student project, not Play Store)
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')   // one kotlin-stdlib version for the AndroidX libraries
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.core:core:1.13.1'
}
